# Review and approve this Blueprint in the Render dashboard.
# No new database, paid compute, persistent disks, or background jobs.
services:
  - type: web
    name: jesienna-wyprawa-wspolnie
    runtime: python
    plan: free
    region: frankfurt
    repo: https://github.com/LesiuPS/ItalianTrip.git
    branch: shared-ledger-2026
    autoDeployTrigger: off
    buildCommand: pip install -r shared/requirements.txt && python -m shared.bootstrap
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 45 shared.bootstrap:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jesienna-wyprawa-wspolne-wydatki
          property: connectionString
      - key: PRIVATE_CONFIG
        sync: false
